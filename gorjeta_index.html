<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0D0D0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gorjeta">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>La Traviata — Gorjeta</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0D0D0D;--s1:#161616;--s2:#1E1E1E;--border:#2C2C2C;
  --text:#EDEDED;--dim:#666;--muted:#3A3A3A;
  --gold:#C9973A;--gold-l:rgba(201,151,58,.15);
  --par:#1A5276;--par-l:rgba(26,82,118,.2);--par-t:#7FB3D3;
  --imp:#4A235A;--imp-l:rgba(74,35,90,.2);--imp-t:#C39BD3;
  --green:#1E8449;--green-l:rgba(30,132,73,.15);--green-t:#58D68D;
  --red:#C0392B;--r:10px;
}
body{font-family:'SF Pro Display','Segoe UI',system-ui,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  max-width:480px;margin:0 auto;
  padding:max(16px,env(safe-area-inset-top)) 14px 80px;}

/* Header */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.logo{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;}
.sem-badge{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;
  background:var(--gold-l);color:var(--gold);border:1px solid var(--gold);}

/* Navegação semana */
.week-nav{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.week-nav button{background:var(--s1);border:1px solid var(--border);color:var(--text);
  width:38px;height:38px;border-radius:8px;font-size:20px;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;}
.week-nav button:active{background:var(--s2);}
.week-info{flex:1;background:var(--s1);border:1px solid var(--border);
  border-radius:8px;padding:8px 12px;text-align:center;}
.wi-sem{font-size:12px;font-weight:700;color:var(--gold);}
.wi-range{font-size:11px;color:var(--dim);margin-top:1px;}

/* Grade */
.grade{margin-bottom:14px;}
.grade-hdr{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;
  padding:0 2px;margin-bottom:6px;}
.grade-hdr span{font-size:9px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.1em;text-align:center;}
.grade-hdr span:first-child{text-align:left;}

.dia-bloco{margin-bottom:8px;}
.dia-label{display:flex;align-items:center;gap:6px;margin-bottom:4px;padding:0 2px;}
.dia-num{font-size:14px;font-weight:800;width:32px;text-align:center;}
.dia-num.par{color:var(--par-t);}
.dia-num.imp{color:var(--imp-t);}
.dia-sem{font-size:10px;font-weight:600;color:var(--dim);}
.dia-sem.bound{color:var(--gold);}
.dia-eq-tag{font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700;}
.dia-eq-tag.par{background:var(--par-l);color:var(--par-t);}
.dia-eq-tag.imp{background:var(--imp-l);color:var(--imp-t);}

.turnos-linha{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;}
.t-spacer{}

.t-cell{}
.t-input{width:100%;padding:11px 6px;background:var(--s1);color:var(--text);
  border:1px solid var(--border);border-radius:8px;font-size:16px;font-weight:700;
  text-align:center;outline:none;-webkit-appearance:none;transition:border-color .15s;}
.t-input:focus{border-color:var(--gold);}
.t-input.filled{background:var(--s2);border-color:var(--s2);}
.t-input::placeholder{color:var(--muted);font-weight:400;font-size:13px;}
.t-meta{display:flex;gap:4px;margin-top:3px;justify-content:center;}
.m-btn{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;
  border:1px solid var(--border);background:transparent;color:var(--dim);
  cursor:pointer;transition:all .12s;line-height:1;}
.m-btn:active{transform:scale(.94);}
.m-btn.on-div{background:var(--gold-l);border-color:var(--gold);color:var(--gold);}
.m-btn.on-pct{background:var(--green-l);border-color:var(--green);color:var(--green-t);}
.m-btn.on-aus{background:rgba(192,57,43,.15);border-color:var(--red);color:#E74C3C;}

.sep-semana{border:none;border-top:1px dashed var(--border);margin:10px 0 8px;}

/* Botão calcular */
.btn-calc{width:100%;padding:16px;border-radius:var(--r);border:none;
  background:var(--gold);color:#000;font-size:16px;font-weight:800;
  cursor:pointer;margin-bottom:14px;letter-spacing:.02em;}
.btn-calc:active{opacity:.8;}

/* Resultados */
.resultados{display:none;margin-bottom:14px;}
.resultados.show{display:block;}
.res-group{border-radius:var(--r);overflow:hidden;margin-bottom:10px;}
.res-hdr{padding:11px 14px;font-size:10px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;}
.res-hdr.par{background:var(--par);color:#fff;}
.res-hdr.imp{background:var(--imp);color:#fff;}
.res-row{display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;background:var(--s1);border-bottom:1px solid var(--border);}
.res-row:last-child{border-bottom:none;}
.res-nome{font-size:13px;font-weight:600;}
.res-val{font-size:19px;font-weight:800;color:var(--gold);}
.res-val.low{color:var(--imp-t);font-size:16px;}

/* Envio */
.send-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.send-btn{padding:13px;border-radius:var(--r);border:none;font-size:13px;
  font-weight:700;cursor:pointer;}
.send-btn:active{opacity:.75;}
.send-par{background:var(--par);color:#fff;}
.send-imp{background:var(--imp);color:#fff;}
.send-all{width:100%;padding:13px;border-radius:var(--r);border:none;
  background:var(--gold);color:#000;font-size:14px;font-weight:800;cursor:pointer;}
.btn-limpar{width:100%;margin-top:8px;padding:11px;border-radius:var(--r);
  border:1px solid var(--border);background:transparent;color:var(--dim);
  font-size:12px;cursor:pointer;}

/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);
  z-index:100;align-items:flex-end;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--s1);border-radius:16px 16px 0 0;padding:20px 16px 40px;
  width:100%;max-width:480px;}
.modal-title{font-size:15px;font-weight:700;margin-bottom:2px;}
.modal-sub{font-size:11px;color:var(--dim);margin-bottom:16px;}
.modal-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px;}
.modal-gc{padding:13px;border-radius:8px;border:1px solid var(--border);
  background:var(--s2);color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;text-align:center;transition:all .12s;}
.modal-gc.aus{background:rgba(192,57,43,.2);border-color:var(--red);color:#E74C3C;}
.modal-gc:active{transform:scale(.97);}
.modal-ok{width:100%;padding:14px;border-radius:8px;border:none;
  background:var(--gold);color:#000;font-size:14px;font-weight:800;cursor:pointer;}

/* Toast */
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--green);color:#fff;padding:10px 22px;border-radius:24px;
  font-size:13px;font-weight:700;transition:transform .3s;z-index:999;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="hdr">
  <div class="logo">🍷 La Traviata Gorjeta</div>
  <div class="sem-badge" id="semBadge">SEM —</div>
</div>

<div class="week-nav">
  <button onclick="mudaSem(-1)">‹</button>
  <div class="week-info">
    <div class="wi-sem" id="wiSem">—</div>
    <div class="wi-range" id="wiRange">—</div>
  </div>
  <button onclick="mudaSem(1)">›</button>
</div>

<div class="grade-hdr">
  <span>Dia</span><span>☀️ DIA</span><span>🌙 NOITE</span>
</div>
<div class="grade" id="grade"></div>

<button class="btn-calc" onclick="calcular()">⚡ CALCULAR SEMANA</button>

<div class="resultados" id="resultados">
  <div class="res-group">
    <div class="res-hdr par">Grupo Par</div>
    <div id="resPar"></div>
  </div>
  <div class="res-group">
    <div class="res-hdr imp">Grupo Ímpar</div>
    <div id="resImp"></div>
  </div>
  <div class="send-row">
    <button class="send-btn send-par" onclick="enviar('par')">📤 Grupo Par</button>
    <button class="send-btn send-imp" onclick="enviar('imp')">📤 Grupo Ímpar</button>
  </div>
  <button class="send-all" onclick="enviar('all')">📋 Resumo completo</button>
  <button class="btn-limpar" onclick="limpar()">✕ Limpar semana</button>
</div>

<!-- Modal ausentes -->
<div class="modal-bg" id="modalBg" onclick="fecharModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">Quem faltou neste turno?</div>
    <div class="modal-sub" id="mSub"></div>
    <div class="modal-list" id="mList"></div>
    <button class="modal-ok" onclick="confirmarModal()">✓ Confirmar</button>
  </div>
</div>

<div class="toast" id="toast">✓</div>

<script>
// ── Constantes ────────────────────────
const INICIO  = new Date(2026,6,1); // 01/jul = offset 0 = Ímpar
const PAR     = ["Hugo","Ermerindo","Breno","Wesley"];
const IMPAR   = ["Gilcemar","Elton","Antonio","Delcino"];
const TODOS   = [...PAR,...IMPAR];
const DIAS_PT = ["dom","seg","ter","qua","qui","sex","sáb"];
const STORE   = 'lt_gorjeta_v3';

// ── Estado ────────────────────────────
let semAtual = 0;
let dados    = carregarDados();
let modalCtx = null;

// ── Persistência ──────────────────────
function carregarDados(){
  try{ const r=localStorage.getItem(STORE); return r?JSON.parse(r):{}; }
  catch{ return {}; }
}
function salvar(){
  try{ localStorage.setItem(STORE,JSON.stringify(dados)); }catch{}
}
function getD(sem,dia,t){
  const k=`${sem}_${dia}_${t}`;
  if(!dados[k]) dados[k]={val:'',div:4,pct:70,aus:[]};
  return dados[k];
}
function setD(sem,dia,t,campo,v){
  getD(sem,dia,t)[campo]=v; salvar();
}

// ── Semana ────────────────────────────
function G(id){ return document.getElementById(id); }

function eqDia(dt){
  return Math.round((dt-INICIO)/86400000)%2===0 ? 'imp' : 'par';
}

function semInfo(off){
  const ms  = INICIO.getTime()+off*7*86400000;
  const ini = new Date(ms);
  const fim = new Date(ms+6*86400000);
  const fd  = d=>String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
  const dias = [];
  for(let i=0;i<7;i++) dias.push(new Date(ms+i*86400000));
  return{ num:off+1, ini, fim, fd_ini:fd(ini), fd_fim:fd(fim), dias };
}

function semHoje(){
  const off=Math.floor((new Date()-INICIO)/86400000);
  return Math.max(0,Math.floor(off/7));
}

// ── Render ────────────────────────────
function renderGrade(){
  const si = semInfo(semAtual);
  G('semBadge').textContent  = 'SEM '+si.num;
  G('wiSem').textContent     = 'Semana '+si.num+'  ·  Qua → Ter';
  G('wiRange').textContent   = si.fd_ini+' → '+si.fd_fim;
  G('resultados').classList.remove('show');

  const grade=G('grade');
  grade.innerHTML='';

  si.dias.forEach((dt,diaI)=>{
    const dow   = dt.getDay();
    const dsem  = DIAS_PT[dow];
    const bound = dow===3||dow===2; // qua ou ter
    const eq    = eqDia(dt);
    const ispar = eq==='par';
    const equipe= ispar?PAR:IMPAR;

    const bloco=document.createElement('div');
    bloco.className='dia-bloco';

    // Label do dia
    const lbl=document.createElement('div');
    lbl.className='dia-label';
    lbl.innerHTML=
      `<span class="dia-num ${eq}">${String(dt.getDate()).padStart(2,'0')}</span>`+
      `<span class="dia-sem${bound?' bound':''}">${dsem}</span>`+
      `<span class="dia-eq-tag ${eq}">${ispar?'Par':'Ímpar'}</span>`;
    bloco.appendChild(lbl);

    // Linha DIA / NOITE
    const linha=document.createElement('div');
    linha.className='turnos-linha';
    linha.innerHTML='<div class="t-spacer"></div>';

    ['DIA','NOITE'].forEach(turno=>{
      const d  = getD(semAtual,diaI,turno);
      const cell=document.createElement('div');
      cell.className='t-cell';

      const inp=document.createElement('input');
      inp.type='number'; inp.inputMode='decimal';
      inp.placeholder='—'; inp.value=d.val;
      inp.className='t-input'+(d.val?' filled':'');
      inp.dataset.sem=semAtual; inp.dataset.dia=diaI; inp.dataset.t=turno;
      inp.addEventListener('input',function(){
        setD(semAtual,diaI,turno,'val',this.value);
        this.classList.toggle('filled',!!this.value);
        G('resultados').classList.remove('show');
      });

      const meta=document.createElement('div');
      meta.className='t-meta';

      // Botão ÷ (abre modal ausentes)
      const bDiv=document.createElement('button');
      bDiv.className='m-btn'+(d.div!==4?' on-div':'')+(d.aus.length?' on-aus':'');
      bDiv.textContent='÷'+d.div+(d.aus.length?'⚠':'');
      bDiv.onclick=()=>abrirModal(semAtual,diaI,turno,equipe,dt,turno);

      // Botão %
      const bPct=document.createElement('button');
      bPct.className='m-btn'+(d.pct===60?' on-pct':'');
      bPct.textContent=d.pct+'%';
      bPct.onclick=()=>{
        const novo=d.pct===70?60:70;
        setD(semAtual,diaI,turno,'pct',novo);
        bPct.textContent=novo+'%';
        bPct.classList.toggle('on-pct',novo===60);
        G('resultados').classList.remove('show');
      };

      meta.appendChild(bDiv); meta.appendChild(bPct);
      cell.appendChild(inp); cell.appendChild(meta);
      linha.appendChild(cell);
    });

    bloco.appendChild(linha);

    // Separador visual antes de uma nova quarta (exceto no início)
    if(diaI>0 && diaI<6){
      const next=si.dias[diaI+1];
      if(next && next.getDay()===3){
        const sep=document.createElement('hr');
        sep.className='sep-semana';
        bloco.appendChild(sep);
      }
    }

    grade.appendChild(bloco);
  });
}

// ── Modal ausentes ────────────────────
function abrirModal(sem,dia,turno,equipe,dt,t){
  modalCtx={sem,dia,turno,equipe};
  const d=getD(sem,dia,turno);
  G('mSub').textContent=
    String(dt.getDate()).padStart(2,'0')+'/'+String(dt.getMonth()+1).padStart(2,'0')+' · '+t;
  const list=G('mList');
  list.innerHTML='';
  equipe.forEach(nome=>{
    const b=document.createElement('button');
    b.className='modal-gc'+(d.aus.includes(nome)?' aus':'');
    b.textContent=nome;
    b.onclick=()=>b.classList.toggle('aus');
    list.appendChild(b);
  });
  G('modalBg').classList.add('show');
}

function confirmarModal(){
  const {sem,dia,turno,equipe}=modalCtx;
  const aus=[...G('mList').querySelectorAll('.aus')].map(b=>b.textContent);
  setD(sem,dia,turno,'aus',aus);
  const div=Math.max(1,equipe.length-aus.length);
  setD(sem,dia,turno,'div',div);

  // Atualiza botão na grade
  const inp=document.querySelector(
    `input[data-sem="${sem}"][data-dia="${dia}"][data-t="${turno}"]`);
  if(inp){
    const bDiv=inp.nextElementSibling.querySelector('.m-btn');
    bDiv.textContent='÷'+div+(aus.length?'⚠':'');
    bDiv.classList.toggle('on-div',div!==4);
    bDiv.classList.toggle('on-aus',aus.length>0);
  }
  fecharModal();
  G('resultados').classList.remove('show');
}

function fecharModal(e){
  if(e&&e.target!==G('modalBg'))return;
  G('modalBg').classList.remove('show');
  modalCtx=null;
}

// ── Calcular ──────────────────────────
function calcular(){
  const si=semInfo(semAtual);
  const acum={};
  TODOS.forEach(n=>acum[n]=0);

  si.dias.forEach((dt,diaI)=>{
    const ispar=eqDia(dt)==='par';
    const equipe=ispar?PAR:IMPAR;
    ['DIA','NOITE'].forEach(turno=>{
      const d=getD(semAtual,diaI,turno);
      const val=parseFloat(d.val)||0;
      if(!val)return;
      const bruta=val*(d.pct/100);
      const pres=equipe.filter(n=>!d.aus.includes(n));
      const porG=pres.length?bruta/pres.length:0;
      pres.forEach(n=>acum[n]+=porG);
    });
  });

  // Renderiza
  window._acum=acum; window._si=si;

  ['Par','Imp'].forEach(g=>{
    const eq=g==='Par'?PAR:IMPAR;
    const max=Math.max(...eq.map(n=>acum[n]));
    const el=G('res'+g); el.innerHTML='';
    eq.forEach(n=>{
      const v=acum[n];
      const row=document.createElement('div');
      row.className='res-row';
      row.innerHTML=`<span class="res-nome">${n}</span>`+
        `<span class="res-val${v<max-0.01?' low':''}">${fmtR(v)}</span>`;
      el.appendChild(row);
    });
  });

  G('resultados').classList.add('show');
  G('resultados').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── Envio ─────────────────────────────
function enviar(tipo){
  const acum=window._acum||{};
  const si=window._si||semInfo(semAtual);
  const sep='─'.repeat(26);
  let txt=`🍷 LA TRAVIATA — SEM ${si.num} (${si.fd_ini}→${si.fd_fim})\n`;

  if(tipo==='par'){
    txt+=`GRUPO PAR\n${sep}\n`;
    PAR.forEach(n=>txt+=`${n.padEnd(14)} ${fmtR(acum[n])}\n`);
    txt+=sep;
  }else if(tipo==='imp'){
    txt+=`GRUPO ÍMPAR\n${sep}\n`;
    IMPAR.forEach(n=>txt+=`${n.padEnd(14)} ${fmtR(acum[n])}\n`);
    txt+=sep;
  }else{
    txt+='═'.repeat(26)+'\nGRUPO PAR\n';
    PAR.forEach(n=>txt+=`  ${n.padEnd(13)} ${fmtR(acum[n])}\n`);
    txt+='GRUPO ÍMPAR\n';
    IMPAR.forEach(n=>txt+=`  ${n.padEnd(13)} ${fmtR(acum[n])}\n`);
    txt+='═'.repeat(26);
  }
  copiar(txt);
}

// ── Navegação ─────────────────────────
function mudaSem(d){
  semAtual=Math.max(0,semAtual+d);
  renderGrade();
}

function limpar(){
  if(!confirm('Limpar todos os valores desta semana?'))return;
  semInfo(semAtual).dias.forEach((_,i)=>{
    ['DIA','NOITE'].forEach(t=>{ delete dados[`${semAtual}_${i}_${t}`]; });
  });
  salvar(); renderGrade(); showToast('Semana limpa');
}

// ── Helpers ───────────────────────────
function fmtR(v){
  return 'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function copiar(txt){
  if(navigator.clipboard) navigator.clipboard.writeText(txt)
    .then(()=>showToast('✓ Copiado!')).catch(()=>fb(txt));
  else fb(txt);
}
function fb(txt){
  const ta=document.createElement('textarea');ta.value=txt;
  ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showToast('✓ Copiado!');}catch{alert(txt);}
  document.body.removeChild(ta);
}
function showToast(msg){
  const t=G('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── iOS hint ──────────────────────────
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.navigator.standalone){
  const h=document.createElement('div');
  h.style.cssText='background:#1A1A1A;border:1px solid #2C2C2C;border-radius:10px;'+
    'padding:10px 14px;margin-bottom:14px;font-size:11px;color:#777;line-height:1.5;';
  h.innerHTML='Para instalar: <strong style="color:#C9973A">Compartilhar</strong> → '+
    '<strong style="color:#C9973A">Adicionar à Tela de Início</strong>';
  document.body.insertBefore(h,document.body.firstChild);
}

// ── Service Worker ────────────────────
if('serviceWorker' in navigator)
  navigator.serviceWorker.register('./sw.js').catch(()=>{});

// ── Init ──────────────────────────────
semAtual = semHoje();
renderGrade();
</script>
</body>
</html>
